name: Build PURCAR ORZ WebAssembly

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install latest
          /tmp/emsdk/emsdk activate latest
      - name: Build C++17 core to WebAssembly
        run: |
          source /tmp/emsdk/emsdk_env.sh
          mkdir -p public/wasm
          em++ cpp/wasm/purcarorz_core.cpp -std=c++17 -O3 -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT=web -s EXPORTED_FUNCTIONS='["_po_create","_po_destroy","_po_set_threshold","_po_set_filter","_po_record","_po_count","_po_average","_malloc","_free"]' -s EXPORTED_RUNTIME_METHODS='["ccall","UTF8ToString","stringToUTF8","lengthBytesUTF8"]' -o public/wasm/purcarorz_core.js
      - name: Commit compiled browser runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/wasm/purcarorz_core.js public/wasm/purcarorz_core.wasm
          git diff --cached --quiet || (git commit -m "Build PURCAR ORZ WebAssembly" && git push)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: purcarorz-site
          path: dist/client
